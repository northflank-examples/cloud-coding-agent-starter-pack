name: check

on:
  push:
  pull_request:

jobs:
  data-and-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m json.tool data/platforms.json > /dev/null
      - run: python3 -m json.tool data/agents.json > /dev/null
      - run: python3 scripts/validate.py
      - run: python3 scripts/generate.py --check
      - run: for f in examples/*/*.sh; do bash -n "$f"; done
